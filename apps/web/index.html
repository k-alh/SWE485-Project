<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Talea — find and track CO-OP and graduate development opportunities." />
    <title>Talea — CO-OP &amp; graduate opportunities</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/talea-mark-64.png" />
    <link rel="apple-touch-icon" href="/brand/talea-mark-192.png" />
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('talea-theme');
        } catch (error) {
          stored = null;
        }
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
